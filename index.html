<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Happy 20/10 💐</title>

        <link rel="stylesheet" href="./style.css" />
    </head>

    <body>
        <div class="container">
            <!-- Màn hình hộp quà -->
            <div class="gift-screen" id="giftScreen">
                <h1>🎁 Một món quà nhỏ dành cho các bạn nữ</h1>

                <p class="hint">Nhấp vào hộp quà nhé...</p>

                <div class="gift" id="gift">
                    <div class="gift-lid"></div>
                    <div class="gift-box"></div>
                    <div class="gift-ribbon"></div>
                </div>
            </div>

            <!-- Màn hình lời chúc -->
            <div class="message-screen" id="messageScreen">
                <div class="flowers">🌹 🌷 🌹 🌷 🌹</div>

                <h1>🌸 Happy Women's Day 20/10 🌸</h1>

                <p class="message">
                    Chúc các bạn nữ ngày 20/10 thật vui vẻ và luôn xinh đẹp nhé!
                    💐
                </p>

                <p class="message">
                    Một món quà nhỏ thôi, nhưng là chút lòng của mik gửi đến tất
                    cả. ❤️
                </p>

                <div class="flower-big">🌹</div>

                <button id="closeBtn">Đóng lại 🎁</button>
            </div>
        </div>

        <!-- Nhạc -->
        <audio id="music" loop>
            <source src="./music/music.mp3" type="audio/mpeg" />
        </audio>

        <script src="./main.js"></script>
    </body>
</html>
